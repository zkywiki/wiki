<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>즈키위키</title>
    <link rel="stylesheet" href="assets/wiki.css" />
    <script>
      /* 저장된 테마를 화면 그리기 전에 먼저 적용 (라이트 화면 번쩍임 방지) */
      try {
        var t = localStorage.getItem("wiki-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <script type="module" src="assets/app.js"></script>
  </head>
  <body>
    <!-- 이 아래는 전부 assets/app.js 가 채운다.
         화면 조각은 assets/components.js, 문서 목록은 assets/docs.js,
         문서 본문은 docs/*.html 에 있다. -->
    <header class="topbar" id="site-header"></header>

    <main class="wrap">
      <article class="article" id="doc"></article>
      <aside class="rail" id="rail"></aside>
    </main>
  </body>
</html>
